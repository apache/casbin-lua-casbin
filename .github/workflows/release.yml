name: Prepare release source

# Tags prepare review input, never a GitHub Release or a LuaRocks upload.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare unsigned review archive
        run: bash scripts/prepare-source.sh "$GITHUB_SHA" "$RUNNER_TEMP/casbin-source"
      - uses: actions/upload-artifact@v4
        with:
          name: casbin-lua-source-${{ github.sha }}
          path: ${{ runner.temp }}/casbin-source/*
          if-no-files-found: error
